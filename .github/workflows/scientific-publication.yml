name: Scientific publication regressions

on:
  push:
    branches: [main]
    paths:
      - "apps/web/lib/problem-research*.ts"
      - "apps/web/components/problem-research-control.tsx"
      - "apps/web/app/console/problems/**"
      - "apps/web/test/unit/problem-research*.test.*"
      - "apps/web/lib/external-expert-review*.ts"
      - "apps/web/components/external-expert-review-control.tsx"
      - "apps/web/app/admin/external-reviews/**"
      - "apps/web/app/admin/page.tsx"
      - "apps/web/test/fixtures/external-expert-review.ts"
      - "apps/web/test/unit/external-expert-review*.test.*"
      - "db/migrations/**"
      - "apps/wire/src/app.ts"
      - "apps/wire/src/problems/**"
      - "apps/wire/src/sessions/**"
      - "apps/wire/src/herald/**"
      - "apps/wire/src/index.ts"
      - "apps/wire/test/unit/herald*.test.ts"
      - "apps/wire/test/integration/herald-room-real-bindings.mjs"
      - "apps/web/lib/workshop-watch.ts"
      - "apps/web/test/unit/workshop-watch*.test.ts"
      - "apps/web/test/unit/herald-live-upgrade.test.ts"
      - "apps/web/lib/public-ledger.ts"
      - "apps/web/lib/claim-page-view.ts"
      - "apps/web/lib/share-card.ts"
      - "apps/web/test/unit/claim-page-view.test.ts"
      - "apps/web/test/unit/claim-dependency-view.test.ts"
      - "apps/web/test/unit/claim-machine-checked.test.ts"
      - "apps/web/test/unit/share-card.test.ts"
      - "scripts/suite/claim-page-e2e.ts"
      - "apps/web/lib/public-record.ts"
      - "apps/web/app/p/**/retractions/**"
      - "apps/web/app/r/**"
      - "apps/web/test/unit/agora-scientific-wiring.test.tsx"
      - "apps/web/test/unit/public-record-page.test.tsx"
      - "apps/wire/src/ledger/retractions*.ts"
      - "apps/wire/src/ledger/event-tail-read.ts"
      - "apps/wire/src/ledger-face.ts"
      - "apps/wire/src/discovery/**"
      - "apps/wire/test/unit/retractions-public-source.test.ts"
      - "apps/wire/test/unit/discovery-generation.test.ts"
      - "apps/wire/test/integration/questions-retractions-real-bindings.mjs"
      - "apps/wire/test/unit/herald-human-workshop-rooms.test.ts"
      - "apps/wire/src/screening/**"
      - "apps/wire/src/moderation/**"
      - "apps/wire/test/unit/synthesis*.test.ts"
      - "apps/wire/test/unit/session-routes.test.ts"
      - "apps/wire/test/integration/*synthesis*.mjs"
      - "apps/wire/test/integration/session-shared-handoff-real-bindings.mjs"
      - "apps/wire/test/integration/honors-real-bindings.mjs"
      - "apps/wire/test/unit/screening-warning.test.ts"
      - "apps/wire/test/unit/*report*.test.ts"
      - "packages/contracts/**"
      - "packages/render/**"
      - ".github/workflows/scientific-publication.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scientific-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scientific-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install locked dependencies
        id: dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck contracts and Worker
        run: |
          bun run --filter @asimposium/contracts typecheck
          bun run --filter @asimposium/wire typecheck
      - name: Check publication code formatting and lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          bunx --no-install biome check apps/wire/src/app.ts apps/wire/src/problems/synthesis-drafts.ts apps/wire/src/problems/external-expert-reviews.ts apps/wire/src/problems/nkz2-router.ts apps/wire/test/unit/synthesis-draft-famous-resolve.test.ts
      - name: Contract and rendering regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          bun run --filter @asimposium/contracts test
          bun run --filter @asimposium/contracts check:drift
          bun run --filter @asimposium/render test
      - name: Workshop ticket expiry and streamed transport regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          bunx --no-install biome check apps/wire/src/herald/room-ticket.ts apps/wire/src/herald/room.ts apps/wire/test/unit/herald-human-workshop-rooms.test.ts
          bun test /dev/null --timeout=120000 apps/wire/test/unit/herald-human-workshop-rooms.test.ts apps/wire/test/unit/herald-workshop-stream.test.ts apps/wire/test/unit/herald-controller.test.ts apps/wire/test/unit/herald-room-refusal.test.ts
      - name: Workshop browser stream and fallback regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: bun test /dev/null --timeout=120000 test/unit/workshop-watch-stream.test.ts test/unit/workshop-watch.test.ts test/unit/herald-live-upgrade.test.ts
      - name: Immutable retraction readers and discovery regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun test /dev/null --timeout=120000 apps/wire/test/unit/retractions-public-source.test.ts apps/wire/test/unit/discovery-generation.test.ts
      - name: Human correction links and pagination regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: bun test /dev/null --timeout=120000 test/unit/agora-scientific-wiring.test.tsx test/unit/public-record-page.test.tsx
      - name: Synthesis publication and screening regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          bun test /dev/null --timeout=120000 apps/wire/test/unit/synthesis-draft-famous-resolve.test.ts apps/wire/test/unit/synthesis.test.ts apps/wire/test/unit/screening-warning.test.ts apps/wire/test/unit/screening-warning-read.test.ts
          bun test /dev/null --timeout=120000 --test-name-pattern 'synthesis|synthesize|shared.*handoff' apps/wire/test/unit/session-routes.test.ts
      - name: Typecheck sponsor result controls
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run --filter @asimposium/web typecheck
      - name: Claim dependency badges and share-card regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: bun test /dev/null --timeout=120000 test/unit/claim-page-view.test.ts test/unit/claim-dependency-view.test.ts test/unit/claim-machine-checked.test.ts test/unit/share-card.test.ts
      - name: Sponsor result confirmation and recovery regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: |
          bun test /dev/null --timeout=120000 test/unit/problem-research-transport.test.ts
          bun test /dev/null --timeout=120000 test/unit/problem-research-recovery.test.ts
          bun test /dev/null --timeout=120000 test/unit/problem-research-actions.test.ts
          bun test /dev/null --timeout=120000 test/unit/problem-research-control.test.tsx
      - name: Operator external review and recovery regressions
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: |
          bun test /dev/null --timeout=120000 test/unit/external-expert-review-transport.test.ts
          bun test /dev/null --timeout=120000 test/unit/external-expert-review-recovery.test.ts
          bun test /dev/null --timeout=120000 test/unit/external-expert-review-actions.test.ts
          bun test /dev/null --timeout=120000 test/unit/external-expert-review-view.test.tsx
          bun test /dev/null --timeout=120000 test/unit/external-expert-review-page.test.tsx
      - name: Native synthesis, shared handoff, and honors journeys
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node apps/wire/test/integration/synthesis-real-bindings.mjs
          node apps/wire/test/integration/session-shared-handoff-real-bindings.mjs
          node apps/wire/test/integration/honors-real-bindings.mjs
      - name: Problem proposal distinctions and publication screening
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          bun test /dev/null --timeout=120000 apps/wire/test/unit/problem-proposal-commands.test.ts apps/wire/test/unit/problem-publication-preview.test.ts
          node apps/wire/test/integration/problem-screening-real-bindings.mjs
      - name: Native questions and retractions journey
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          CLOUDFLARE_CF_FETCH_ENABLED: "false"
        run: node apps/wire/test/integration/questions-retractions-real-bindings.mjs
      - name: Native Herald private stream and cross-transport replay journey
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          CLOUDFLARE_CF_FETCH_ENABLED: "false"
        run: node apps/wire/test/integration/herald-room-real-bindings.mjs
