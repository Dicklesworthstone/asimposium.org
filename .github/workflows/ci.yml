name: ci

# First CI slice (asimposiumorg-rk75, under OPS.2): every push to main and
# every PR runs the repo's own gates so format/type/test regressions stop
# depending on some agent remembering to run them locally. Stage-order
# doctrine machinery and gate-diff discipline remain in OPS.2 proper.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

  tests-fast:
    name: unit + contract (fast packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run --filter @asimposium/contracts test
      - run: bun run --filter @asimposium/protocol test
      - run: bun run --filter @asimposium/render test
      - run: bun run --filter @asimposium/web test

  wire-unit:
    name: wire unit gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # The full canonical wire gate, shell harnesses included. This is the
      # same `bun scripts/gate.ts unit` the local landing procedure runs; it
      # is slow (~15 min) because it drives real workerd processes.
      - run: bun run --filter @asimposium/wire test:unit

  cli:
    name: asimp cargo tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo test --manifest-path cli/Cargo.toml
