name = "asimposium-s2-krater-local"
main = "worker.ts"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

# The /__s2/ harness surface exists only in this local-only trio: wrangler.s2.toml,
# wrangler.s2-legacy.toml, and wrangler.s2-upgrade.toml. No deployed configuration declares it,
# so the diagnostic and fixture routes are absent in production rather than refused there.
[vars]
S2_LOCAL_HARNESS = "enabled"

[[d1_databases]]
binding = "DB"
database_name = "asimposium-s2-krater-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../../../db/migrations"

[[durable_objects.bindings]]
name = "KRATER_OUTBOX"
class_name = "KraterOutboxDrainer"

[exports.KraterOutboxDrainer]
type = "durable-object"
storage = "sqlite"
