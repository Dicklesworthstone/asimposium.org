name = "asimposium-s2-krater-upgrade"
main = "worker.ts"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

# This is the third local-only harness config alongside wrangler.s2.toml and
# wrangler.s2-legacy.toml. It is used after the legacy config created the exact 0001 database,
# retaining that database identity while switching to the repository migration journal.
[vars]
S2_LOCAL_HARNESS = "enabled"

[[d1_databases]]
binding = "DB"
database_name = "asimposium-s2-krater-legacy"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../../../db/migrations"

[[durable_objects.bindings]]
name = "KRATER_OUTBOX"
class_name = "KraterOutboxDrainer"

[exports.KraterOutboxDrainer]
type = "durable-object"
storage = "sqlite"
