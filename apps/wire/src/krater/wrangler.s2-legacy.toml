name = "asimposium-s2-krater-legacy"
main = "worker.ts"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Local-only harness capability; see the wrangler.s2.toml, wrangler.s2-legacy.toml, and
# wrangler.s2-upgrade.toml trio. No deployed config declares this variable.
[vars]
S2_LOCAL_HARNESS = "enabled"

[[d1_databases]]
binding = "DB"
database_name = "asimposium-s2-krater-legacy"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "fixtures/legacy-migrations"
