name = "asimposium-s3-local"
main = "local-worker.ts"
compatibility_date = "2026-08-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "asimposium-s3-local"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "asimposium-s3-artifacts-local"
