[workspace]
members = ["."]
resolver = "3"

[package]
name = "asimp"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
description = "Optional ASImposium command-line companion; curl remains sufficient."

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
ureq = { version = "2", default-features = true }
