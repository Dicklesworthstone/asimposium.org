[workspace]
members = ["."]
resolver = "3"

[package]
name = "asimp"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
description = "Optional ASImposium command-line companion; curl remains sufficient."

[dependencies]
base64 = "=0.22.1"
clap = { version = "=4.6.6", features = ["derive"] }
jsonschema = { version = "=0.61.1", default-features = false }
serde_json = "=1.0.149"
ureq = { version = "=2.12.1", default-features = true }
url = "=2.5.8"
