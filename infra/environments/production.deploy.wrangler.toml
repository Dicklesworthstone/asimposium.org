# Deploy-time resolution of the generated production.wrangler.toml:
#   - the provisioned D1 id is substituted (the generated file carries the
#     CI-time ${ASIMP_D1_DATABASE_ID_PRODUCTION} placeholder);
#   - HERALD_ROOMS (HeraldRoom), KRATER_OUTBOX (KraterOutboxDrainer), and
#     Workers AI ([ai] binding = "AI") are all bound to match
#     infra/environments.toml (drift-checked by validate-environments.mjs and
#     generate-wrangler.mjs --check; omitting AI would fail closed every
#     production ledger promotion into 202 SCREENING_HOLD);
#   - SERVICE_ENVELOPE_KEYS carries only PUBLIC Ed25519 verification keys
#     (non-secret by design; the signing key lives in Vercel env).
# Regenerate nothing over this file; when OPS.3 closes, fold this back into
# the generator.
name = "asimposium-stoa-prod"
main = "../../apps/wire/src/index.ts"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat", "enable_request_signal"]
workers_dev = false
preview_urls = false

# Custom domain: creates the DNS record on the asimposium.org zone (proxied).
routes = [
  { pattern = "a.asimposium.org", custom_domain = true },
]

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "asimposium-prod-cutover-20261123-9c16b322"
database_id = "96f5be90-7b31-4c9a-a8c8-c0dc918bef37"
migrations_dir = "../../db/migrations"

[[r2_buckets]]
# role: private-cas
binding = "ARTIFACTS"
bucket_name = "asimposium-artifacts-prod"

[[r2_buckets]]
# role: public-delivery
binding = "PUBLIC_ARTIFACTS"
bucket_name = "asimposium-public-prod"

[[durable_objects.bindings]]
name = "HERALD_ROOMS"
class_name = "HeraldRoom"

[[durable_objects.bindings]]
name = "KRATER_OUTBOX"
class_name = "KraterOutboxDrainer"

[exports.HeraldRoom]
type = "durable-object"
storage = "sqlite"

[exports.KraterOutboxDrainer]
type = "durable-object"
storage = "sqlite"

[ai]
binding = "AI"

[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.txt"]
fallthrough = true

[vars]
# The only origin this Worker may claim for itself, matching the generated
# production projection. Non-secret, and never derived from request metadata: a
# Host or X-Forwarded-Host header is caller-supplied, so trusting it would let a
# request relocate the origin the Worker believes it serves. The Worker fails
# closed without it.
STOA_ORIGIN = "https://a.asimposium.org"
AGORA_ORIGIN = "https://asimposium.org"
SERVICE_ENVELOPE_KEYS = '[{"kid":"prod-svc-2026-08","publicKeyHex":"0b137bcd0a75c16e2a4d5f734e1f550018fc6cea15edd5693bb8b597096e5f76","notBefore":1786665600}]'
