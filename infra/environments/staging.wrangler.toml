# GENERATED FROM infra/environments.toml — DO NOT EDIT BY HAND.
# Environment: staging. Regenerate with: bun infra/generate-wrangler.mjs --write
# Verify with:  bun infra/generate-wrangler.mjs --check

name = "asimposium-stoa-staging"
main = "../../apps/wire/src/index.ts"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "asimposium-staging"
database_id = "${ASIMP_D1_DATABASE_ID_STAGING}"
migrations_dir = "../../db/migrations"

[[r2_buckets]]
# role: private-cas
binding = "ARTIFACTS"
bucket_name = "asimposium-artifacts-staging"

[[r2_buckets]]
# role: public-delivery
binding = "PUBLIC_ARTIFACTS"
bucket_name = "asimposium-public-staging"

[[durable_objects.bindings]]
name = "KRATER_OUTBOX"
class_name = "KraterOutboxDrainer"

[exports.KraterOutboxDrainer]
type = "durable-object"
storage = "sqlite"

# Deferred: HERALD_ROOMS (HeraldRoom) is declared in
# infra/environments.toml but is not bound here, because the Worker entrypoint
# does not export its class yet. Binding it would make this config undeployable.

[vars]
STOA_ORIGIN = "https://a-staging.asimposium.org"
AGORA_ORIGIN = "https://staging.asimposium.org"

[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.txt", "**/*.schema.json"]
fallthrough = true

# The public-delivery bucket is served on its own R2 custom domain, which is
# configured on the bucket and never as a Worker route:
#   artifacts-staging.asimposium.org
# The private-cas bucket carries no custom domain by construction.

# Vercel calls this environment at the STOA_ORIGIN projected above:
#   https://a-staging.asimposium.org

# Signing key ids (public identifiers; the keys live in wrangler secret):
#   signing:          staging-2026-08, staging-2026-07
#   service envelope: staging-svc-2026-08, staging-svc-2026-07
