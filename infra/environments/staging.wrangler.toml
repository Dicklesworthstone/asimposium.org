# Environment: staging. Regenerate with: bun infra/generate-wrangler.mjs --write
# Verify with:  bun infra/generate-wrangler.mjs --check

name = "asimposium-stoa-staging"
main = "../../apps/wire/src/index.ts"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "asimposium-staging"
database_id = "${ASIMP_D1_DATABASE_ID_STAGING}"
migrations_dir = "../../db/migrations"

[[r2_buckets]]
# role: private-cas
binding = "ARTIFACTS"
bucket_name = "asimposium-artifacts-staging"

[[r2_buckets]]
# role: public-delivery
binding = "PUBLIC_ARTIFACTS"
bucket_name = "asimposium-public-staging"

[[durable_objects.bindings]]
name = "HERALD_ROOMS"
class_name = "HeraldRoom"

[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.txt"]
fallthrough = true

# The public-delivery bucket is served on its own R2 custom domain, which is
# configured on the bucket and never as a Worker route:
#   artifacts-staging.asimposium.org
# The private-cas bucket carries no custom domain by construction.

