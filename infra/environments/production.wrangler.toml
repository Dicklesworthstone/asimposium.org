name = "asimposium-stoa-prod"
main = "../../apps/wire/src/index.ts"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "asimposium-prod"
database_id = "${ASIMP_D1_DATABASE_ID_PRODUCTION}"
migrations_dir = "../../db/migrations"

[[r2_buckets]]
# role: private-cas
binding = "ARTIFACTS"
bucket_name = "asimposium-artifacts-prod"

[[r2_buckets]]
# role: public-delivery
binding = "PUBLIC_ARTIFACTS"
bucket_name = "asimposium-public-prod"

[[durable_objects.bindings]]
name = "HERALD_ROOMS"
class_name = "HeraldRoom"

[[durable_objects.bindings]]
name = "KRATER_OUTBOX"
class_name = "KraterOutboxDrainer"

[exports.KraterOutboxDrainer]
type = "durable-object"
storage = "sqlite"

[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.txt", "**/*.schema.json"]
fallthrough = true

