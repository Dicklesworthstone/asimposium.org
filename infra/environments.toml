# ASImposium environment topology (bead asimposiumorg-p1g, OPS.3).
#
# This file is the single declarative source for what each environment is made
# of: its D1 database, its two R2 buckets and their roles, its Durable Object
# namespace, and its signing key ids. `validate-environments.mjs` enforces every
# rule below; nothing here is applied to Cloudflare by reading this file.
#
# IT CONTAINS NO SECRETS AND MUST NEVER CONTAIN ANY.
#   - Signing key *ids* (`kid`) are public identifiers and belong here. The keys
#     themselves live in `wrangler secret` / Vercel env and nowhere else.
#   - Resource identifiers for deployable environments are written as
#     `${VAR_NAME}` references resolved from CI at deploy time. A literal id is
#     rejected by the validator, so a real one cannot be committed by accident.
#   - The validator also scans every value for credential shapes and fails on
#     anything that looks like a key, token, or PEM block.
#
# Binding NAMES are identical across environments so the Worker's code path is
# the same everywhere (Fable §13.3). Resource names and ids are distinct across
# environments so nothing is ever shared. Parity is checked by ROLE, never by
# bucket name (bead: "compare roles rather than bucket names").

schema_version = 1

[policy]
# Every environment must declare exactly these R2 roles — no more, no fewer.
required_r2_roles = ["private-cas", "public-delivery"]
# Only this role may carry a public custom domain.
publishable_role = "public-delivery"
# The apex artifact hostname. Production alone may claim it.
production_artifact_hostname = "artifacts.asimposium.org"
# Migrations roll forward only; there are no down-migrations (see migrate.mjs).
rollback_policy = "forward-only"
outbox_cron = "*/5 * * * *"
# Every environment must bind exactly these names, no more and no fewer. The
# Worker's code path is then identical everywhere (Fable §13.3).
required_bindings = ["DB", "ARTIFACTS", "PUBLIC_ARTIFACTS", "HERALD_ROOMS", "KRATER_OUTBOX"]
# Bindings that belong to the topology above but are NOT yet emitted into any
# generated wrangler config, because `apps/wire/src/index.ts` does not export
# their Durable Object class yet. Cloudflare refuses a Durable Object binding
# whose class the entrypoint does not export, so emitting one would render a
# config that cannot deploy at all. Declaring an `[exports.<class>]` block for a
# class that does not exist would be the same lie in the other direction.
#
# Deferral is declared once and applies to every environment identically:
# parity is preserved by the binding being absent EVERYWHERE, never by one
# environment diverging from another. Retire an entry by deleting it here on
# the same change that adds the class to the Worker's exports.
deferred_bindings = ["HERALD_ROOMS"] # HeraldRoom lands with W7.

# The exact origin each remote environment's Worker answers on. `STOA_ORIGIN`
# is projected into every generated config from the environment's own
# `worker_origin` and is checked against this table, so a swapped pair (staging
# declaring the production origin, or the reverse) is refused even though both
# values would still be distinct. The Worker must never derive its own origin
# from request metadata — a Host or X-Forwarded-Host header is attacker-supplied
# and would let a caller relocate the origin the Worker believes it serves.
# `local` is deliberately absent: it is validated as plaintext loopback instead
# of being pinned to one port.
[policy.canonical_worker_origins]
production = "https://a.asimposium.org"
staging = "https://a-staging.asimposium.org"

# The Agora (human plane) origin each environment's device-flow verification
# URL names. The trusted set is exactly these two (Fable §5.3 writes /approve
# as a path); local shares the production origin deliberately — the contract
# vocabulary has no mandate for a loopback Agora.
[policy.canonical_agora_origins]
production = "https://asimposium.org"
staging = "https://staging.asimposium.org"

# Which environment each Vercel deployment target calls. Preview deployments
# must reach staging and must never reach production (Fable §13.3, ADR-2).
[vercel]
production_environment = "production"
preview_environment = "staging"

# ---------------------------------------------------------------------------
# local — miniflare / wrangler local persistence. No account, no network.
# ---------------------------------------------------------------------------
[env.local]
kind = "local"
worker_origin = "http://127.0.0.1:8787"
agora_origin = "https://asimposium.org"
is_preview = false
may_hold_production_keys = false
destructive_operations_allowed = true

[env.local.d1]
binding = "DB"
database_name = "asimposium-local"
database_id = "00000000-0000-0000-0000-000000000000"

[[env.local.r2]]
binding = "ARTIFACTS"
role = "private-cas"
bucket_name = "asimposium-artifacts-local"
custom_domain = ""

[[env.local.r2]]
binding = "PUBLIC_ARTIFACTS"
role = "public-delivery"
bucket_name = "asimposium-public-local"
custom_domain = ""

[env.local.durable_objects]
binding = "HERALD_ROOMS"
class_name = "HeraldRoom"
script_namespace = "asimposium-stoa-local"
storage = "sqlite"

[env.local.outbox]
binding = "KRATER_OUTBOX"
class_name = "KraterOutboxDrainer"
storage = "sqlite"

[env.local.keys]
current_kid = "local-dev-1"
previous_kid = ""
service_envelope_current_kid = "local-svc-1"
service_envelope_previous_kid = ""

# ---------------------------------------------------------------------------
# staging — the preview tier. Vercel previews point here. Synthetic data only.
# ---------------------------------------------------------------------------
[env.staging]
kind = "remote"
worker_origin = "https://a-staging.asimposium.org"
agora_origin = "https://staging.asimposium.org"
is_preview = true
may_hold_production_keys = false
destructive_operations_allowed = true

[env.staging.d1]
binding = "DB"
database_name = "asimposium-staging"
database_id = "${ASIMP_D1_DATABASE_ID_STAGING}"

[[env.staging.r2]]
binding = "ARTIFACTS"
role = "private-cas"
bucket_name = "asimposium-artifacts-staging"
custom_domain = ""

[[env.staging.r2]]
binding = "PUBLIC_ARTIFACTS"
role = "public-delivery"
bucket_name = "asimposium-public-staging"
custom_domain = "artifacts-staging.asimposium.org"

[env.staging.durable_objects]
binding = "HERALD_ROOMS"
class_name = "HeraldRoom"
script_namespace = "asimposium-stoa-staging"
storage = "sqlite"

[env.staging.outbox]
binding = "KRATER_OUTBOX"
class_name = "KraterOutboxDrainer"
storage = "sqlite"

# S-4 screening (asimposiumorg-xeg / asimposiumorg-ntpd). This is an OPTIONAL
# table, not a member of policy.required_bindings: the local dev topology must
# keep validating without a Workers AI account. Promotion holds fail closed and
# the corpus route returns a typed 503 wherever the binding is absent. Every
# declaring environment must use the same binding name.
[env.staging.ai]
binding = "AI"

[env.staging.keys]
current_kid = "staging-2026-08"
previous_kid = "staging-2026-07"
service_envelope_current_kid = "staging-svc-2026-08"
service_envelope_previous_kid = "staging-svc-2026-07"

# ---------------------------------------------------------------------------
# production — the only environment that may claim the apex artifact hostname.
# ---------------------------------------------------------------------------
[env.production]
kind = "remote"
worker_origin = "https://a.asimposium.org"
agora_origin = "https://asimposium.org"
is_preview = false
may_hold_production_keys = true
destructive_operations_allowed = false

[env.production.d1]
binding = "DB"
database_name = "asimposium-prod"
database_id = "${ASIMP_D1_DATABASE_ID_PRODUCTION}"

[[env.production.r2]]
binding = "ARTIFACTS"
role = "private-cas"
bucket_name = "asimposium-artifacts-prod"
custom_domain = ""

[[env.production.r2]]
binding = "PUBLIC_ARTIFACTS"
role = "public-delivery"
bucket_name = "asimposium-public-prod"
custom_domain = "artifacts.asimposium.org"

[env.production.durable_objects]
binding = "HERALD_ROOMS"
class_name = "HeraldRoom"
script_namespace = "asimposium-stoa-prod"
storage = "sqlite"

[env.production.outbox]
binding = "KRATER_OUTBOX"
class_name = "KraterOutboxDrainer"
storage = "sqlite"

[env.production.ai]
binding = "AI"

[env.production.keys]
current_kid = "prod-2026-08"
previous_kid = "prod-2026-07"
service_envelope_current_kid = "prod-svc-2026-08"
service_envelope_previous_kid = "prod-svc-2026-07"
